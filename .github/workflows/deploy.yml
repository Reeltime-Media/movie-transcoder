name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q || [ $? -eq 5 ]

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host_secret: [GCE_HOST_1, GCE_HOST_2, GCE_HOST_3]
    steps:
      - name: Resolve worker host
        id: host
        env:
          H1: ${{ secrets.GCE_HOST_1 }}
          H2: ${{ secrets.GCE_HOST_2 }}
          H3: ${{ secrets.GCE_HOST_3 }}
        run: |
          case "${{ matrix.host_secret }}" in
            GCE_HOST_1) HOST="$H1" ;;
            GCE_HOST_2) HOST="$H2" ;;
            GCE_HOST_3) HOST="$H3" ;;
          esac
          if [ -z "$HOST" ]; then
            echo "Skipping — secret ${{ matrix.host_secret }} not set"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "value=$HOST" >> "$GITHUB_OUTPUT"

      - name: Deploy to GCP worker over SSH
        if: steps.host.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            SRC_DIR="${{ secrets.DEPLOY_DIR }}/movie-transcoder"
            COMPOSE_DIR="${{ secrets.DEPLOY_DIR }}"
            APP_USER="${{ secrets.GCE_USER }}"

            sudo -u "$APP_USER" git -C "$SRC_DIR" fetch --all --prune
            sudo -u "$APP_USER" git -C "$SRC_DIR" checkout main
            sudo -u "$APP_USER" git -C "$SRC_DIR" pull --ff-only origin main

            sudo docker compose \
              --project-directory "$COMPOSE_DIR" \
              -f "$COMPOSE_DIR/docker-compose.yml" \
              up -d --build transcode

            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8001/health >/dev/null; then
                echo "health ok"
                exit 0
              fi
              sleep 2
            done
            echo "health check failed"
            sudo docker compose --project-directory "$COMPOSE_DIR" -f "$COMPOSE_DIR/docker-compose.yml" ps
            exit 1
